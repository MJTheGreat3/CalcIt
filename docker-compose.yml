name: calcit

services:
  calcit:
    image: ${DOCKERHUB_USER:-mattjoe}/calcit:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: "8080"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
      HEALTH_SHOW_DETAILS: "never"
    expose:
      - "8080"
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - calcit-net

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calcit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - calcit-net

networks:
  calcit-net:
    driver: bridge
