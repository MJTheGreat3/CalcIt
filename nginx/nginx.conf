server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Re-resolving every 10s lets nginx pick up
    # replicas that were recreated with new IPs during a redeploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $calcit_backend http://calcit:8080;

    location / {
        proxy_pass $calcit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Retry on the other replica if one is restarting
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Liveness of the proxy itself (does not touch the backend)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
