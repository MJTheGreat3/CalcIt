spring.application.name=calcit
server.port=${SERVER_PORT:8080}

# Actuator: expose only the health and info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}

# Shut down gracefully so Compose restarts do not drop in-flight requests
server.shutdown=graceful
